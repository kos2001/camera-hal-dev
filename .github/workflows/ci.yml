name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-server.lock
      - name: Install Python dependencies
        run: python -m pip install -r requirements-server.lock
      - name: Check Python dependencies
        run: python -m pip check
      - name: Audit pinned Python dependencies
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements-server.lock
          no-deps: true
      - name: Python tests
        run: python -m unittest discover -s tests -q
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci
        working-directory: web
      - name: Audit web dependencies
        run: npm audit --audit-level=high
        working-directory: web
      - name: Build web app
        run: npm run build
        working-directory: web
      - name: Install browser for UI tests
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Verify bilingual browser UI
        run: |
          export CAMHAL_DB_PATH="${RUNNER_TEMP}/camhal-ui-smoke.sqlite3"
          python -m uvicorn backend.app:app --host 127.0.0.1 --port 8010 --no-access-log > "${RUNNER_TEMP}/camhal-ui-server.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8010/api/ready > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8010/api/ready
          CAMHAL_BASE_URL=http://127.0.0.1:8010 npm run test:ui --prefix web
      - name: Build container image
        run: docker build -t camhal-sim:ci .
      - name: Verify image fails closed without OIDC configuration
        run: |
          if output=$(docker run --rm camhal-sim:ci python -c 'from backend.auth import AuthConfig; AuthConfig.from_env()' 2>&1); then
            echo 'Container accepted missing OIDC configuration' >&2
            exit 1
          fi
          grep -q 'Production requires CAMHAL_AUTH_MODE=oidc' <<< "$output"
      - name: Verify gateway authentication boundary
        run: bash scripts/smoke_gateway.sh camhal-sim:ci
      - name: Verify production Compose login and tenant isolation
        run: python scripts/smoke_production_compose.py camhal-sim:ci
      - name: Verify production backup export and restore
        run: python scripts/smoke_backup.py camhal-sim:ci
