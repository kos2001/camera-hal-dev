x-json-logging: &bounded-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  camhal:
    build: .
    environment:
      CAMHAL_ENV: production
      CAMHAL_AUTH_MODE: oidc
      CAMHAL_OIDC_ISSUER: ${CAMHAL_OIDC_ISSUER:?}
      CAMHAL_OIDC_AUDIENCE: ${CAMHAL_OIDC_AUDIENCE:?}
      CAMHAL_OIDC_JWKS_URL: ${CAMHAL_OIDC_JWKS_URL:?}
      CAMHAL_MAX_RUNS: ${CAMHAL_MAX_RUNS:-1000}
      CAMHAL_MAX_RUNS_PER_OWNER: ${CAMHAL_MAX_RUNS_PER_OWNER:-200}
    volumes:
      - camhal-data:/var/lib/camhal
    networks:
      - app-net
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *bounded-logs
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:8.0-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - session-net
    restart: unless-stopped
    logging: *bounded-logs
    read_only: true
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 3
    security_opt:
      - no-new-privileges:true

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4
    environment:
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${CAMHAL_OIDC_ISSUER:?}
      OAUTH2_PROXY_CLIENT_ID: ${CAMHAL_OIDC_CLIENT_ID:?}
      OAUTH2_PROXY_CLIENT_SECRET: ${CAMHAL_OIDC_CLIENT_SECRET:?}
      OAUTH2_PROXY_REDIRECT_URL: ${CAMHAL_PUBLIC_URL:?}/oauth2/callback
      OAUTH2_PROXY_SCOPE: ${CAMHAL_OIDC_SCOPE:?}
      OAUTH2_PROXY_EMAIL_DOMAINS: ${CAMHAL_ALLOWED_EMAIL_DOMAIN:?}
      OAUTH2_PROXY_COOKIE_SECRET: ${CAMHAL_COOKIE_SECRET:?}
      OAUTH2_PROXY_COOKIE_NAME: __Host-camhal_session
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_TRUSTED_PROXY_IPS: ${CAMHAL_PROXY_IP:?}
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_PASS_ACCESS_TOKEN: "true"
      OAUTH2_PROXY_PASS_AUTHORIZATION_HEADER: "false"
      OAUTH2_PROXY_PASS_BASIC_AUTH: "false"
      OAUTH2_PROXY_PASS_USER_HEADERS: "false"
      OAUTH2_PROXY_REQUEST_LOGGING: "false"
      OAUTH2_PROXY_SESSION_STORE_TYPE: redis
      OAUTH2_PROXY_REDIS_CONNECTION_URL: redis://redis:6379
      OAUTH2_PROXY_UPSTREAMS: static://200
    networks:
      - auth-net
      - session-net
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *bounded-logs
    read_only: true
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginx:1.30.4-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/tls:/etc/nginx/tls:ro
    networks:
      auth-net:
        ipv4_address: ${CAMHAL_PROXY_IP:?}
      app-net: {}
    depends_on:
      camhal:
        condition: service_healthy
      oauth2-proxy:
        condition: service_started
    restart: unless-stopped
    logging: *bounded-logs
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true

networks:
  auth-net:
    ipam:
      config:
        - subnet: ${CAMHAL_AUTH_SUBNET:?}
  app-net: {}
  session-net:
    internal: true

volumes:
  camhal-data:
