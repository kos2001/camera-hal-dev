limit_req_zone $binary_remote_addr zone=camhal_requests:10m rate=10r/s;
log_format camhal '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                  '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log camhal;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;
    absolute_redirect off;
    access_log /var/log/nginx/access.log camhal;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 32k;

    location /oauth2/ {
        proxy_pass http://oauth2-proxy:4180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Auth-Request-Redirect $request_uri;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-Access-Token "";
    }

    location = /oauth2/auth {
        internal;
        proxy_pass http://oauth2-proxy:4180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-Access-Token "";
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
    }

    location /api/ {
        limit_req zone=camhal_requests burst=20 nodelay;
        limit_req_status 429;
        auth_request /oauth2/auth;
        auth_request_set $access_token $upstream_http_x_auth_request_access_token;
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $auth_cookie always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        proxy_set_header Authorization "Bearer $access_token";
        proxy_set_header X-Forwarded-Access-Token "";
        proxy_set_header Host $host;
        proxy_pass http://camhal:8010;
    }

    location / {
        limit_req zone=camhal_requests burst=20 nodelay;
        limit_req_status 429;
        auth_request /oauth2/auth;
        error_page 401 = @oauth2_signin;
        auth_request_set $access_token $upstream_http_x_auth_request_access_token;
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $auth_cookie always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        proxy_set_header Authorization "Bearer $access_token";
        proxy_set_header X-Forwarded-Access-Token "";
        proxy_set_header Host $host;
        proxy_pass http://camhal:8010;
    }

    location @oauth2_signin {
        return 302 /oauth2/sign_in?rd=$uri;
    }
}
