limit_req_zone $binary_remote_addr zone=camhal_requests:10m rate=10r/s;
log_format camhal '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                  '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log camhal;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;
    absolute_redirect off;
    access_log /var/log/nginx/access.log camhal;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 32k;

    location = /signed-out {
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'none'; frame-ancestors 'none'" always;
        return 200 '<!doctype html><html lang="ko"><meta charset="utf-8"><title>로그아웃</title><h1>서비스 세션이 종료되었습니다.</h1><p>인증 제공자 세션은 남아 있을 수 있습니다. 공유 기기라면 인증 제공자에서도 로그아웃하세요.</p><a href="/oauth2/start?rd=%2F">다시 로그인</a></html>';
    }

    location /oauth2/ {
        limit_req zone=camhal_requests burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://oauth2-proxy:4180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header X-Auth-Request-Redirect $request_uri;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-Access-Token "";
    }

    location = /oauth2/auth {
        internal;
        proxy_pass http://oauth2-proxy:4180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-Access-Token "";
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
    }

    location /api/ {
        limit_req zone=camhal_requests burst=20 nodelay;
        limit_req_status 429;
        auth_request /oauth2/auth;
        auth_request_set $access_token $upstream_http_x_auth_request_access_token;
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $auth_cookie always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        proxy_set_header Authorization "Bearer $access_token";
        proxy_set_header X-Forwarded-Access-Token "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header Host $host;
        proxy_pass http://camhal:8010;
    }

    location / {
        limit_req zone=camhal_requests burst=20 nodelay;
        limit_req_status 429;
        auth_request /oauth2/auth;
        error_page 401 = @oauth2_signin;
        auth_request_set $access_token $upstream_http_x_auth_request_access_token;
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $auth_cookie always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        proxy_set_header Authorization "Bearer $access_token";
        proxy_set_header X-Forwarded-Access-Token "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header Host $host;
        proxy_pass http://camhal:8010;
    }

    location @oauth2_signin {
        return 302 /oauth2/sign_in?rd=$uri;
    }
}
